name: 뉴스레터 자동 발행

on:
  schedule:
    - cron: "40 0 * * *" # 09:40 KST. 앞선 두 수집의 푸시와 겹치지 않게 띄운다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.any }}
    defaults:
      run:
        working-directory: news
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: news/.nvmrc
          cache: npm
          cache-dependency-path: news/package-lock.json

      - run: npm ci

      - name: 뉴스 다이제스트 생성
        id: digest
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
          NEWS_WINDOW_HOURS: ${{ vars.NEWS_WINDOW_HOURS }}
        run: npm run digest

      - name: 수집 상태 기록
        if: always()
        run: |
          echo "### 뉴스 다이제스트 수집 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "- 결과: ${{ steps.digest.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.digest.outcome }}" = "failure" ]; then
            echo "::warning::뉴스 수집 일부가 실패했습니다. 성공한 소스의 결과는 계속 저장합니다."
          fi

      - name: 변경 확인
        id: changed
        if: always()
        run: |
          if [ -z "$(git status --porcelain src .state)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "새 소식이 없습니다."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 변경사항 저장
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .state
          git commit -m "뉴스 다이제스트 자동 발행"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 수집 실패 알림
        if: always() && steps.digest.outcome == 'failure'
        run: |
          echo "::error::뉴스 수집이 실패했습니다. 저장·배포 절차는 성공한 결과만 넘겼습니다."
          exit 1

  # GITHUB_TOKEN으로 민 커밋은 push 워크플로를 깨우지 않는다. 배포를 직접 부른다.
  deploy:
    needs: collect
    if: always() && needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
