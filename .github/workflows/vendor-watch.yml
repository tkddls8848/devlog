name: 벤더 문서 갱신 수집

# IBM · Lenovo · HPE 의 제품 문서 갱신을 모아 아카이브에 쌓고,
# 하루치를 글 한 편으로 정리해 GitHub Pages 에 발행합니다.
#
# 하루 한 번만 돌립니다. 더 자주 돌리면 그날 갱신이 여러 편으로 쪼개져
# (…-updates.md, …-updates-2.md) 기록이 지저분해집니다. 세 소스 모두
# 최근 며칠치는 계속 목록에 남아 있어서 하루 간격이면 놓치지 않습니다.

on:
  schedule:
    # 00:10 UTC = 09:10 KST. 전날 갱신이 모두 반영된 뒤 훑습니다.
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vendor-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 시크릿 확인
        id: secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "ai=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare 시크릿이 없어 요약 없이 목록만 기록합니다."
          else
            echo "ai=true" >> "$GITHUB_OUTPUT"
          fi

      # 시크릿이 없어도 수집은 합니다. 요약은 못 만들어도 그날 갱신을 놓치면
      # 롤링 창이 넘어가 영영 복구할 수 없기 때문입니다.
      - name: 갱신 수집
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
          IBM_REGION: ${{ vars.IBM_REGION }}
        run: |
          if [ "${{ steps.secrets.outputs.ai }}" = "true" ]; then
            npm run watch:vendors
          else
            npm run watch:vendors -- --no-ai
          fi

      - name: 변경 여부 확인
        id: changed
        run: |
          if [ -z "$(git status --porcelain src/updates src/_data/vendorArchive.json .state)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "새로 올라온 문서가 없습니다."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드
        if: steps.changed.outputs.any == 'true'
        env:
          PATH_PREFIX: /devlog/
        run: npm run build

      - name: 변경사항 커밋
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/updates src/_data/vendorArchive.json .state
          git commit -m "벤더 문서 갱신 수집"
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.any == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.any == 'true'
        with:
          path: _site

  deploy:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
