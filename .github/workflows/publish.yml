name: 기록 자동 발행

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 개발 일지 생성
        id: digest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
        run: npm run digest

      - name: 벤더 갱신 일지 생성
        id: vendors
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
          IBM_REGION: ${{ vars.IBM_REGION }}
        run: npm run watch:vendors

      - name: 수집 상태 기록
        if: always()
        run: |
          echo "### 자동 수집 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "- 개발 일지: ${{ steps.digest.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 벤더 문서: ${{ steps.vendors.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.digest.outcome }}" = "failure" ]; then
            echo "::warning::개발 일지 수집 일부가 실패했습니다. 벤더 수집과 저장은 계속합니다."
          fi
          if [ "${{ steps.vendors.outcome }}" = "failure" ]; then
            echo "::warning::벤더 수집 일부가 실패했습니다. 성공한 수집 결과는 계속 저장합니다."
          fi

      - name: 변경 확인
        id: changed
        if: always()
        run: |
          if [ -z "$(git status --porcelain src .state)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "새 기록이 없습니다."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드
        if: steps.changed.outputs.any == 'true'
        env:
          PATH_PREFIX: /devlog/
        run: npm run build

      - name: 변경사항 저장
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .state
          git commit -m "기록 자동 발행"
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.any == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.any == 'true'
        with:
          path: _site

      - name: 수집 실패 알림
        if: always() && (steps.digest.outcome == 'failure' || steps.vendors.outcome == 'failure')
        run: |
          echo "::error::일부 수집이 실패했습니다. 성공한 결과는 이미 저장·배포 절차로 넘겼습니다."
          exit 1

  deploy:
    needs: publish
    if: always() && needs.publish.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
