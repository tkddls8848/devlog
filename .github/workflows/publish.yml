name: 기록 자동 발행

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 개발 일지 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
        run: npm run digest

      - name: 벤더 갱신 일지 생성
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
          IBM_REGION: ${{ vars.IBM_REGION }}
        run: npm run watch:vendors

      - name: 변경 확인
        id: changed
        run: |
          if [ -z "$(git status --porcelain src .state)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "새 기록이 없습니다."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.changed.outputs.any == 'true'

      - name: 빌드
        if: steps.changed.outputs.any == 'true'
        env:
          PATH_PREFIX: /devlog/
        run: npm run build

      - name: 변경사항 저장
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .state
          git commit -m "기록 자동 발행"
          git push

      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.any == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.any == 'true'
        with:
          path: _site

  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
