name: 뉴스레터 Workers 배포

# 뉴스레터만 GitHub Pages를 떠나 Cloudflare Workers에서 돈다. Pages는 저장소당
# 사이트 하나뿐이라 세 사이트가 한 아티팩트에 묶여 있었는데, 뉴스레터는 자기
# 배포를 따로 가진다. deploy.yml은 이제 devlog·archive만 본다.
on:
  push:
    branches: [main]
    # 사이트 산출물을 바꿀 수 있는 파일만 본다. shared/는 세 사이트가 함께 쓰는
    # 테마라 여기서도 배포를 깨운다.
    paths:
      - "news/**"
      - "shared/**"
      - ".github/workflows/news-deploy.yml"
      - "!news/test/**"
      - "!news/README.md"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-news
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news
    steps:
      # 수집 워크플로가 커밋·푸시한 뒤 이 워크플로를 부른다. ref를 비워 두면
      # 호출자 이벤트의 SHA, 즉 그 커밋 직전 상태를 체크아웃해 한 주기 뒤처진다.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: news/.nvmrc
          cache: npm
          cache-dependency-path: news/package-lock.json

      - run: npm ci

      # Worker가 도메인 뿌리를 통째로 맡으므로 경로 앞가지가 없다. 이웃 사이트는
      # 이제 다른 오리진이라 상대 경로를 쓸 수 없고, 비워 두면 src/_data/site.js의
      # 절대 주소 기본값이 그대로 쓰인다.
      - name: 빌드
        env:
          PATH_PREFIX: /
          DEVLOG_URL: ${{ vars.DEVLOG_URL }}
          ARCHIVE_URL: ${{ vars.ARCHIVE_URL }}
        run: npm run build

      # 배포 토큰은 Workers Scripts 편집 권한이 필요하다. 수집이 쓰는 Workers AI
      # 토큰과 권한이 달라 CF_WORKERS_API_TOKEN을 먼저 보고, 없으면 CF_API_TOKEN을
      # 그대로 쓴다.
      - name: Workers에 배포
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: news
          wranglerVersion: "4.125.0"
          command: deploy

      - name: 배포 결과 기록
        if: always()
        run: |
          echo "### 뉴스레터 Workers 배포" >> "$GITHUB_STEP_SUMMARY"
          echo "- 결과: ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 주소: ${{ steps.publish.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
