# HPE 문서 사이트는 Cloudflare Worker의 요청을 HTTP 520으로 막는다.
# 그래서 HPE만 GitHub 러너에서 수집해 D1 HTTP API로 운영 DB에 넣는다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN(D1 편집 권한), CLOUDFLARE_ACCOUNT_ID
name: HPE archive

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect HPE documents into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 저장소 Secrets가 없습니다."
            exit 1
          fi
          node news/tools/push-vendor-docs.mjs
