name: 개발 일지 자동 발행

# 공개 저장소의 푸시를 모아 개발 일지를 만들고 즉시 GitHub Pages에 발행합니다.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: push-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - name: 시크릿 확인
        id: secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Workers AI 시크릿이 없어 건너뜁니다."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      - name: 개발 일지 생성
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
        run: npm run digest

      - name: 변경 여부 확인
        id: changed
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ -z "$(git status --porcelain src/posts .state)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "새 푸시가 없어 발행할 글이 없습니다."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드
        if: steps.changed.outputs.any == 'true'
        env:
          PATH_PREFIX: /devlog/
        run: npm run build

      - name: 변경사항 커밋
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/posts .state
          git commit -m "개발 일지 자동 발행"
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.any == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.any == 'true'
        with:
          path: _site

  deploy:
    needs: digest
    if: needs.digest.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
