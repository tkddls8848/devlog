name: 개발 일지 초안 생성

# 내 공개 저장소의 푸시를 모아 개발 일지 초안을 만들고 PR 을 엽니다.
#
# 왜 폴링인가:
#   이 저장소는 다른 저장소의 푸시를 직접 알 수 없습니다. 알림을 받으려면
#   소스 저장소마다 워크플로와 토큰을 심어야 하는데, 그러면 새로 만든
#   저장소는 매번 손으로 추가해야 합니다. "내 모든 공개 저장소" 를 설정 없이
#   따라가려고 GitHub Events API 를 짧은 주기로 확인합니다.
#   (지연은 최대 15분 남짓입니다. 급하면 Actions 탭에서 직접 실행하세요.)
#
# 만들어지는 글은 draft: true 라서 병합해도 사이트에 나오지 않습니다.
# 내용을 확인하고 draft 줄을 지워야 발행됩니다.
#
# 준비: Settings → Secrets and variables → Actions → Secrets 에
#   CF_ACCOUNT_ID   Cloudflare 계정 ID
#   CF_API_TOKEN    Workers AI 권한을 가진 API 토큰
# (Cloudflare 대시보드 → Workers AI → "Use REST API" 에서 둘 다 받을 수 있습니다.)

on:
  schedule:
    # 15분마다. cron 은 최소 5분이지만 실제 실행은 몇 분 밀립니다.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# 앞 실행이 PR 을 만드는 중에 다음 실행이 겹치면 브랜치가 꼬입니다.
concurrency:
  group: push-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 시크릿을 넣기 전까지 15분마다 실패 메일이 오는 것을 막습니다.
      # (secrets 는 if: 조건에서 직접 못 읽어서 단계 출력으로 옮깁니다.)
      - name: 시크릿 확인
        id: secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_ACCOUNT_ID 가 없어 건너뜁니다. README 의 '처음 설정' 을 보세요."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc

      # 초안 생성 자체에는 의존성이 필요 없습니다(fetch 만 씁니다).
      # 아래 빌드 검증 단계에서 Eleventy 가 필요해 설치합니다.
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      - name: 초안 생성
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run digest

      - name: 변경 여부 확인
        id: changed
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ -z "$(git status --porcelain src/posts .state)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "새 푸시가 없어 만들어진 초안이 없습니다."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # 초안이 사이트를 깨뜨리지 않는지 확인합니다. draft: true 라 페이지는
      # 생성되지 않지만, front matter 가 잘못되면 빌드가 실패합니다.
      - name: 빌드 검증
        if: steps.changed.outputs.any == 'true'
        run: npm run build

      - name: PR 생성
        if: steps.changed.outputs.any == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # 실행마다 브랜치를 새로 만들지 않습니다. 고정 이름을 쓰면 열려 있는
          # PR 이 갱신되어, 검토가 밀려도 PR 이 쌓이지 않고 한 건에 모입니다.
          branch: blog-draft/push-digest
          title: "개발 일지 초안: 검토 요청"
          commit-message: |
            개발 일지 초안 자동 생성

            draft: true 상태라 병합해도 사이트에는 나오지 않습니다.
          body: |
            최근 푸시를 모아 만든 초안입니다. **검토 전에는 발행되지 않습니다.**

            커밋을 작성한 날(KST)로 나눠 **하루에 한 편씩** 만듭니다.
            밀린 며칠치가 한 번에 잡히면 파일도 그만큼 생깁니다.

            ## 확인할 것

            - [ ] 커밋에 없는 내용을 모델이 지어내지 않았는지
            - [ ] 글의 날짜와 내용이 맞는지 (다른 날 이야기가 섞이지 않았는지)
            - [ ] 공개하면 곤란한 저장소·작업이 섞이지 않았는지
            - [ ] 제목과 요약이 내용과 맞는지

            ## 발행 방법

            내용을 고친 뒤 front matter 의 `draft: true` 줄을 지우고 병합하세요.
            그 줄이 있는 동안에는 페이지가 생성되지 않습니다.

            `.state/last-seen.json` 은 어디까지 처리했는지를 적어 둔 파일입니다.
            **이 PR 을 병합해야 그 지점이 넘어갑니다.** 닫기만 하면 다음 실행이
            같은 구간을 다시 요약해 이 PR 을 새로 채웁니다.
          labels: |
            devlog
            ai-draft
          add-paths: |
            src/posts
            .state
