name: GitHub Pages 배포

# GitHub Pages는 저장소당 사이트 하나만 배포한다. devlog·archive는 따로 빌드한 뒤
# 여기서만 하나의 아티팩트로 합친다. 뉴스레터는 Cloudflare Workers로 빠져나가
# news-deploy.yml에서 자기 배포를 따로 가진다.
on:
  push:
    branches: [main]
    # 사이트 산출물을 바꿀 수 없는 파일만 뺀다. 한 푸시에 다른 파일이 하나라도
    # 섞이면 그대로 배포되므로, 애매하면 빼지 않는 편이 안전하다. news/는 여기서
    # 배포하지 않으므로 통째로 뺀다. shared/는 세 사이트가 함께 쓰는 테마라
    # 남겨 두고, 뉴스레터 쪽 배포도 같은 푸시에서 따로 깨어난다.
    paths-ignore:
      - "news/**"
      - "**/test/**"
      - "**/README.md"
      - ".github/workflows/test.yml"
      - ".github/workflows/news-deploy.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 수집 워크플로가 커밋·푸시한 뒤 이 워크플로를 부른다. ref를 비워 두면
      # 호출자 이벤트의 SHA, 즉 그 커밋 직전 상태를 체크아웃해 한 주기 뒤처진다.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: devlog Node 준비
        uses: actions/setup-node@v7
        with:
          node-version-file: devlog/.nvmrc
          cache: npm
          cache-dependency-path: devlog/package-lock.json

      - name: devlog 의존성 설치
        working-directory: devlog
        run: npm ci

      # 뉴스레터는 이제 다른 오리진이라 상대 경로로 이을 수 없다. NEWS_URL을
      # 비워 두면 src/_data/site.js의 Worker 절대 주소 기본값이 그대로 쓰인다.
      - name: devlog 빌드
        working-directory: devlog
        env:
          PATH_PREFIX: /devlog/
          ARCHIVE_URL: /devlog/archive/
          NEWS_URL: ${{ vars.NEWS_URL }}
        run: npm run build

      - name: archive Node 준비
        uses: actions/setup-node@v7
        with:
          node-version-file: archive/.nvmrc
          cache: npm
          cache-dependency-path: archive/package-lock.json

      - name: archive 의존성 설치
        working-directory: archive
        run: npm ci

      - name: archive 빌드
        working-directory: archive
        env:
          PATH_PREFIX: /devlog/archive/
          DEVLOG_URL: /devlog/
          NEWS_URL: ${{ vars.NEWS_URL }}
        run: npm run build

      - name: 두 사이트 합치기
        run: |
          mkdir -p dist
          cp -r devlog/_site/. dist/
          mkdir -p dist/archive
          cp -r archive/_site/. dist/archive/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
