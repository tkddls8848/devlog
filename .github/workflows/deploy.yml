name: GitHub Pages 배포

# main 에 올라온 내용을 빌드해 GitHub Pages 로 내보냅니다.
# 초안 PR 을 병합하고 draft 줄을 지웠을 때 실제 발행이 일어나는 지점입니다.
#
# 준비: Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 합니다.
# (기본값인 "Deploy from a branch" 로 두면 이 워크플로의 결과가 무시됩니다.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 배포를 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 빌드
        # 프로젝트 사이트라 주소에 저장소 이름이 붙습니다
        # (https://tkddls8848.github.io/devlog/). 이 접두사를 주지 않으면
        # CSS 와 링크가 전부 404 가 됩니다.
        env:
          PATH_PREFIX: /devlog/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
